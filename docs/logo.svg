  <path d="M 58 342 C 68 210 186 126 285 128" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.20"/>
  <path d="M 70 324 C 80 202 194 124 285 128" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.29"/>
  <path d="M 84 304 C 94 194 202 122 285 128" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.39"/>
  <path d="M 100 282 C 110 186 212 120 285 128" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.50"/>
  <path d="M 120 260 C 130 178 222 118 285 128" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.62"/>
  <path d="M 143 240 C 153 170 234 116 285 128" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.74"/>
  <path d="M 170 222 C 180 162 248 114 285 128" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.87"/>

  <!-- Dot: Signal Blue glow + white core -->
  <circle cx="285" cy="128" r="16" fill="#3B82F6" opacity="0.35"/>
  <circle cx="285" cy="128" r="9"  fill="#ffffff"/>
</svg>
