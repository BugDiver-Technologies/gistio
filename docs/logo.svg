<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background: Gistio Ink -->
  <rect width="400" height="400" rx="80" fill="#1A1F36"/>

  <!-- Sweep lines — all cubic beziers converging at the dot (285, 128) -->
