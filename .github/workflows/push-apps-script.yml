name: Push to Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'app-scripts/**'

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install clasp
        run: npm ci

      - name: Write clasp credentials
        run: echo '${{ secrets.CLASP_TOKEN }}' > ~/.clasprc.json

      - name: Write .clasp.json
        run: |
          echo "{\"scriptId\":\"${{ secrets.CLASP_SCRIPT_ID }}\",\"rootDir\":\"app-scripts\"}" > .clasp.json

      - name: Push to Apps Script
        run: npm run push
